<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recur Showreel</title>
<style>
@font-face{font-family:'Geist Mono';src:url('fonts/GeistMono-Regular.ttf');font-weight:400}
@font-face{font-family:'Geist Mono';src:url('fonts/GeistMono-Bold.ttf');font-weight:700}
html,body{margin:0;background:#000;height:100%;overflow:hidden}
canvas{display:block;position:absolute;left:0;top:0;transform-origin:0 0}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
(() => {
const W = 1920, H = 1080, BPM = 128, BEAT = 60 / BPM, DUR = 32 * BEAT, FPS = 60;
const COL = { bg:'#0d0d0d', ink:'#1a1a1a', paper:'#fafafa', grey:'#8a8a8a', green:'#4ade80', greenD:'#16a34a',
  amber:'#fbbf24', blue:'#60a5fa', violet:'#c084fc' };
const MONO = '"Geist Mono", ui-monospace, monospace';

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outCubic: x => 1 - Math.pow(1 - x, 3),
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inOutQuart: x => x < .5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2,
  outBack: x => { const s = 1.70158; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); },
};
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const hash2 = (a, b) => hash(a * 57.13 + b * 91.7 + 3.1);
const pulse = (t, d = 7) => Math.exp(-((t % BEAT) / BEAT) * d);
const mix = (a, b, t) => {
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return '#' + pa.map((v, i) => Math.round(lerp(v, pb[i], t)).toString(16).padStart(2, '0')).join('');
};
function fr(c, x, y, w, h) { const x0 = Math.round(x), y0 = Math.round(y); c.fillRect(x0, y0, Math.round(x + w) - x0, Math.round(y + h) - y0); }
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, Math.max(0, r)); }
function poly(c, pts, p) { // stroke a polyline up to progress p
  const L = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(d); tot += d; }
  let rem = tot * p; c.beginPath(); c.moveTo(...pts[0]);
  for (let i = 1; i < pts.length && rem > 0; i++) {
    const f = Math.min(1, rem / L[i - 1]);
    c.lineTo(lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)); rem -= L[i - 1];
  }
  c.stroke();
}

// ---------- pixel font (5x7), the R is the Recur logo ----------
const G = {
  A:['.XXX.','X...X','X...X','XXXXX','X...X','X...X','X...X'],
  B:['XXXX.','X...X','X...X','XXXX.','X...X','X...X','XXXX.'],
  C:['.XXXX','X....','X....','X....','X....','X....','.XXXX'],
  D:['XXXX.','X...X','X...X','X...X','X...X','X...X','XXXX.'],
  E:['XXXXX','X....','X....','XXXX.','X....','X....','XXXXX'],
  F:['XXXXX','X....','X....','XXXX.','X....','X....','X....'],
  G:['.XXXX','X....','X....','X..XX','X...X','X...X','.XXXX'],
  H:['X...X','X...X','X...X','XXXXX','X...X','X...X','X...X'],
  I:['XXXXX','..X..','..X..','..X..','..X..','..X..','XXXXX'],
  K:['X...X','X..X.','X.X..','XX...','X.X..','X..X.','X...X'],
  L:['X....','X....','X....','X....','X....','X....','XXXXX'],
  N:['X...X','XX..X','X.X.X','X..XX','X...X','X...X','X...X'],
  O:['.XXX.','X...X','X...X','X...X','X...X','X...X','.XXX.'],
  R:['XXXX.','X...X','X...X','XXXX.','X.X..','X..X.','X...X'],
  S:['.XXXX','X....','X....','.XXX.','....X','....X','XXXX.'],
  T:['XXXXX','..X..','..X..','..X..','..X..','..X..','..X..'],
  U:['X...X','X...X','X...X','X...X','X...X','X...X','.XXX.'],
  Y:['X...X','X...X','.X.X.','..X..','..X..','..X..','..X..'],
  '.':['.','.','.','.','.','.','X'],
};
const lcache = {};
function layout(str) {
  if (lcache[str]) return lcache[str];
  const cells = []; let x = 0;
  for (const ch of str) {
    if (ch === ' ') { x += 3; continue; }
    const g = G[ch];
    for (let r = 0; r < 7; r++) for (let q = 0; q < g[r].length; q++) if (g[r][q] === 'X') cells.push([x + q, r]);
    x += g[0].length + 1;
  }
  return lcache[str] = { cells, w: x - 1 };
}
// fn(i,cx,cy,n) -> null | {s,dx,dy,a,color}
function pText(c, str, ox, oy, cell, color, fn) {
  const L = layout(str);
  for (let i = 0; i < L.cells.length; i++) {
    const [cx, cy] = L.cells[i]; let s = 1, dx = 0, dy = 0, a = 1, col = color;
    if (fn) { const r = fn(i, cx, cy, L.cells.length); if (!r) continue; s = r.s ?? 1; dx = r.dx || 0; dy = r.dy || 0; a = r.a ?? 1; col = r.color || color; }
    if (s <= 0.001) continue;
    c.fillStyle = col; if (a < 1) c.globalAlpha = a;
    const sz = cell * s + (s >= .999 ? .7 : 0); fr(c, ox + cx * cell + dx + (cell - sz) / 2, oy + cy * cell + dy + (cell - sz) / 2, sz, sz);
    if (a < 1) c.globalAlpha = 1;
  }
  return L;
}
const logoCells = layout('R').cells;

// ---------- timeline ----------
const T = { s1: 0, s2: 4 * BEAT, s3a: 12 * BEAT, s3b: 16 * BEAT, s4: 20 * BEAT, s5: 26 * BEAT };
let HUD = COL.paper;
const CUES = { beat: BEAT, scenes: T, land: [], checks: [], share: [], cal: [], letters: [], type: [] };

// ================= S1: logo assembly =================
const S1_T0 = .10, S1_STEP = .0455, S1_DUR = .5, IMPACT = 3 * BEAT;
const rank = (() => { const idx = logoCells.map((_, i) => i).sort((a, b) => hash(a + 11) - hash(b + 11)); const r = []; idx.forEach((v, k) => r[v] = k); return r; })();
const s1Land = i => S1_T0 + rank[i] * S1_STEP + S1_DUR;
for (let i = 0; i < logoCells.length; i++) CUES.land.push(s1Land(i));
CUES.land.sort((a, b) => a - b);

function S1(c, t) {
  HUD = COL.paper;
  c.fillStyle = COL.bg; c.fillRect(0, 0, W, H);
  const ga = E.outCubic(prog(t, 0, .5)), ti = t - IMPACT;
  for (let gx = 0; gx <= 48; gx++) for (let gy = 0; gy <= 27; gy++) {
    const x = gx * 40, y = gy * 40, d = Math.hypot(x - 960, y - 540), r = ti * 1500;
    const ring = ti > 0 ? Math.exp(-Math.pow((d - r) / 90, 2)) * Math.exp(-ti * 2.2) : 0;
    c.globalAlpha = clamp(.16 * ga + ring * .9); c.fillStyle = COL.paper;
    const s = 3 + ring * 7; fr(c, x - s / 2, y - s / 2, s, s);
  }
  c.globalAlpha = 1;
  const cell = 100, ox = 710, oy = 190;
  c.save();
  if (ti > 0) { const k = 1 + .05 * Math.exp(-ti * 9); c.translate(960, 540); c.scale(k, k); c.translate(-960, -540); }
  logoCells.forEach(([cx, cy], i) => {
    const tx = ox + cx * cell, ty = oy + cy * cell, land = s1Land(i);
    const ax = hash(i + 3) < .5, dir = hash(i + 9) < .5 ? -1 : 1, dist = 1300 + hash(i) * 500;
    const sx = tx + (ax ? dir * dist : 0), sy = ty + (ax ? 0 : dir * dist);
    const pos = tt => { const e = E.outExpo(prog(tt, land - S1_DUR, land)); return [lerp(sx, tx, e), lerp(sy, ty, e)]; };
    const p = prog(t, land - S1_DUR, land);
    if (p <= 0) return;
    if (p < 1) for (let k = 6; k >= 1; k--) { const [gx, gy] = pos(t - k * .014); c.globalAlpha = .45 * (1 - k / 7); c.fillStyle = COL.paper; fr(c, gx, gy, cell, cell); }
    c.globalAlpha = 1; c.fillStyle = COL.paper;
    const [x, y] = pos(t), tl = t - land;
    const s = tl >= 0 ? 1 + .1 * Math.exp(-tl * 20) : 1, sz = cell * s;
    fr(c, x + (cell - sz) / 2, y + (cell - sz) / 2, sz, sz);
    if (tl >= 0) { c.globalAlpha = .4 * Math.exp(-tl * 16); const b = cell * 1.5; fr(c, x + (cell - b) / 2, y + (cell - b) / 2, b, b); c.globalAlpha = 1; }
  });
  c.restore();
  if (ti > 0) {
    const h = 350 + ti * 1500; c.globalAlpha = Math.exp(-ti * 3.5); c.strokeStyle = COL.paper; c.lineWidth = 3;
    c.strokeRect(960 - h * .72, 540 - h, h * 1.44, h * 2); c.globalAlpha = 1;
  }
}

// ================= S2: kinetic type =================
const S2STEPS = [
  { b:0, bg:0, text:'DO IT.' }, { b:1, bg:1, text:'AGAIN.' },
  { b:2, bg:0, rows:2 }, { b:2.5, bg:0, rows:3 }, { b:3, bg:1, rows:4 }, { b:3.5, bg:1, rows:6 },
  { b:4, bg:0, rows:8 }, { b:4.5, bg:0, rows:12 }, { b:5, bg:1, rows:18 }, { b:5.5, bg:1, rows:27 },
  { b:6, bg:0, word:0 }, { b:6 + 2 / 3, bg:0, word:1 }, { b:6 + 4 / 3, bg:0, word:2 },
];
const WORDS = [['HABITS.', 'build them.'], ['TASKS.', 'check them off.'], ['STREAKS.', 'keep them alive.']];

function S2(c, t) {
  const b = Math.max(0, t) / BEAT;
  let k = 0; for (let i = 0; i < S2STEPS.length; i++) if (S2STEPS[i].b <= b + 1e-9) k = i;
  const st = S2STEPS[k], ts = (b - st.b) * BEAT, dark = st.bg === 1;
  const bg = dark ? COL.bg : COL.paper, fg = dark ? COL.paper : COL.ink, dot = dark ? COL.green : COL.greenD;
  HUD = null;
  c.fillStyle = bg; c.fillRect(0, 0, W, H);
  c.save();
  const slam = 1 + (st.rows ? .1 : .22) * Math.exp(-ts * 17);
  c.translate(960, 540); c.scale(slam, slam); c.translate(-960, -540);
  const popFn = (i, cx, cy, n) => {
    const r = hash(i * 3.1 + k) * .1; if (ts < r) return null;
    return { s: 1 + .9 * Math.exp(-(ts - r) * 28), color: i === n - 1 ? dot : fg };
  };
  if (st.text) {
    const L = layout(st.text), cell = Math.min(44, Math.floor(1600 / L.w));
    pText(c, st.text, (W - L.w * cell) / 2, (H - 7 * cell) / 2, cell, fg, popFn);
  } else if (st.word !== undefined) {
    const [word, sub] = WORDS[st.word], L = layout(word), cell = 38, oy = 340;
    pText(c, word, (W - L.w * cell) / 2, oy, cell, fg, popFn);
    const n = Math.floor(clamp((ts - .08) / .22) * sub.length);
    c.fillStyle = dark ? COL.grey : '#6b6b6b'; c.font = `400 54px ${MONO}`; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.fillText(sub.slice(0, n), 960, oy + 7 * cell + 100);
  } else {
    const n = st.rows, rowH = H / n, cell = rowH / 9, hl = Math.floor(b * 4) % n;
    for (let i = 0; i < n; i++) {
      const str = i % 3 === 2 ? 'AND AGAIN.' : 'AGAIN.', L = layout(str), period = (L.w + 4) * cell;
      const dir = i % 2 ? 1 : -1, speed = 220 + n * 45, off = dir * t * speed + i * period * .37;
      const y = i * rowH + (rowH - 7 * cell) / 2, col = i === hl ? dot : fg;
      let x = -(((off % period) + period) % period) - period;
      for (; x < W; x += period) pText(c, str, x, y, cell, col, null);
    }
  }
  c.restore();
  if (st.rows || st.text === 'AGAIN.') {
    const n = st.rows || 1, txt = `AGAIN x${n}`;
    c.font = `700 44px ${MONO}`; c.textAlign = 'left'; c.textBaseline = 'middle';
    const w = c.measureText(txt).width + 48;
    c.fillStyle = fg; rr(c, 80, H - 150, w, 80, 14); c.fill();
    c.fillStyle = bg; c.fillText(txt, 104, H - 108);
  }
}

// ================= S3a: wall of tasks =================
const WALL = [
  ['Morning run','PERSONAL','DAILY'], ['Deep work','WORK','DAILY'], ['Read 20 pages','PERSONAL','DAILY'], ['Weekly review','WORK','WEEKLY'],
  ['Spanish lesson','SCHOOL','WEEKLY'], ['Pay rent','OTHER','MONTHLY'], ['Call mom','PERSONAL','WEEKLY'], ['Water plants','OTHER','WEEKLY'],
  ['Meal prep','PERSONAL','WEEKLY'], ['Inbox zero','WORK','DAILY'], ['Journal','PERSONAL','DAILY'], ['Backup photos','OTHER','MONTHLY'],
  ['Stretch','PERSONAL','DAILY'], ['Study session','SCHOOL','DAILY'], ['Renew passport','OTHER','YEARLY'], ['Gym','PERSONAL','DAILY'],
];
const CATC = { WORK: COL.blue, PERSONAL: COL.violet, SCHOOL: COL.amber, OTHER: '#9ca3af' };
const CW = 560, CH = 150, PITCH = 176;
const COLS3 = [{ x:-620, dir:-1, sp:230, ph:0 }, { x:0, dir:1, sp:300, ph:90 }, { x:620, dir:-1, sp:260, ph:40 }];
const cardY = (col, i, t) => i * PITCH + COLS3[col].ph + COLS3[col].dir * COLS3[col].sp * t;
const WALLEV = [[.5,1],[1,0],[1.5,2],[2,1],[2.5,2],[3,0],[3.5,1],[3.75,2]].map(([bt, col], n) => {
  const te = bt * BEAT, ty = (hash(n * 5 + 2) - .5) * 440, k = COLS3[col];
  return { te, col, i: Math.round((ty - k.ph - k.dir * k.sp * te) / PITCH) };
});
const doneAt = {}; WALLEV.forEach(e => { doneAt[e.col * 1000 + e.i] = e.te; CUES.checks.push(T.s3a + e.te); });
const preDone = (col, i) => hash(col * 131 + i * 17) < .3 && doneAt[col * 1000 + i] === undefined;

function drawCard(c, x, y, i, col, t) {
  const key = col * 1000 + i, te = doneAt[key], pre = preDone(col, i);
  const it = WALL[(((i * 7 + col * 3) % 16) + 16) % 16];
  const dp = pre ? 1 : te !== undefined ? prog(t, te, te + .18) : 0, tt = te !== undefined ? t - te : -1;
  c.fillStyle = '#171717'; rr(c, x - CW / 2, y - CH / 2, CW, CH, 22); c.fill();
  c.lineWidth = 2; c.strokeStyle = dp > 0 && !pre ? mix('#2a2a2a', COL.green, Math.exp(-Math.max(0, tt) * 3)) : '#2a2a2a'; c.stroke();
  const bx = x - CW / 2 + 34, by = y - 32;
  c.lineWidth = 3; c.strokeStyle = '#4a4a4a';
  if (dp > 0) {
    const s = pre ? 1 : E.outBack(dp); c.fillStyle = COL.green;
    rr(c, bx + 32 - 32 * s, by + 32 - 32 * s, 64 * s, 64 * s, 16); c.fill();
    c.strokeStyle = COL.bg; c.lineWidth = 6; c.lineCap = 'round'; c.lineJoin = 'round';
    poly(c, [[bx + 15, by + 34], [bx + 27, by + 46], [bx + 49, by + 20]], pre ? 1 : prog(dp, .3, 1));
  } else { rr(c, bx, by, 64, 64, 16); c.stroke(); }
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.fillStyle = COL.paper; c.font = `700 36px ${MONO}`; c.fillText(it[0], x - CW / 2 + 126, y - 6);
  c.fillStyle = CATC[it[1]]; fr(c, x - CW / 2 + 126, y + 18, 14, 14);
  c.fillStyle = COL.grey; c.font = `400 22px ${MONO}`; c.fillText(`${it[1]}  /  ${it[2]}`, x - CW / 2 + 152, y + 33);
  const base = 1 + Math.floor(hash(col * 7 + i * 3) * 5);
  for (let q = 0; q < 7; q++) {
    const on = q < base, today = q === base && dp > 0 && !pre;
    c.fillStyle = on || pre && q === base ? '#2f7d4f' : '#262626';
    if (today) c.fillStyle = COL.green;
    fr(c, x + CW / 2 - 34 - (6 - q) * 20, y + 22, 14, 14);
  }
  if (tt > 0 && tt < .55) {
    const p = tt / .55; c.globalAlpha = (1 - p) * .9; c.strokeStyle = COL.green; c.lineWidth = 3;
    const g = E.outCubic(p) * 22; rr(c, x - CW / 2 - g, y - CH / 2 - g, CW + g * 2, CH + g * 2, 22 + g); c.stroke();
    c.fillStyle = COL.green;
    for (let q = 0; q < 14; q++) {
      const a = q / 14 * Math.PI * 2 + hash(q) * .5, d = E.outCubic(p) * (140 + hash(q + 5) * 120), sz = 8 + hash(q + 9) * 8;
      fr(c, bx + 32 + Math.cos(a) * d - sz / 2, by + 32 + Math.sin(a) * d - sz / 2, sz, sz);
    }
    c.globalAlpha = 1;
  }
}

function S3a(c, t) {
  HUD = COL.paper;
  c.fillStyle = COL.bg; c.fillRect(0, 0, W, H);
  c.save();
  const z = 1.08 + .06 * prog(t, 0, 1.9);
  c.translate(960, 540); c.rotate(-.1); c.scale(z, z);
  COLS3.forEach((k, col) => {
    const lo = Math.floor((-1000 - k.ph - k.dir * k.sp * t) / PITCH), hi = Math.ceil((1000 - k.ph - k.dir * k.sp * t) / PITCH);
    for (let i = lo; i <= hi; i++) drawCard(c, k.x, cardY(col, i, t), i, col, Math.max(0, t));
  });
  c.restore();
  let g = c.createLinearGradient(0, H - 330, 0, H); g.addColorStop(0, 'rgba(13,13,13,0)'); g.addColorStop(.45, 'rgba(13,13,13,.97)');
  c.fillStyle = g; c.fillRect(0, H - 330, W, 330);
  g = c.createLinearGradient(0, 0, 0, 280); g.addColorStop(0, 'rgba(13,13,13,1)'); g.addColorStop(.7, 'rgba(13,13,13,.97)'); g.addColorStop(1, 'rgba(13,13,13,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, 280);
  const n = WALLEV.filter(e => t >= e.te).length, last = WALLEV.filter(e => t >= e.te).pop();
  const pp = last ? 1 + .25 * Math.exp(-(t - last.te) * 14) : 1;
  c.textAlign = 'right'; c.textBaseline = 'alphabetic'; c.fillStyle = COL.grey; c.font = `400 26px ${MONO}`; c.fillText('DONE TODAY', W - 90, 78);
  c.save(); c.translate(W - 90, 160); c.scale(pp, pp); c.fillStyle = COL.paper; c.font = `700 84px ${MONO}`; c.fillText(String(n).padStart(2, '0') + '/08', 0, 0); c.restore();
  const cap = 'CHECK IT OFF.', L = layout(cap);
  pText(c, cap, 90, H - 90 - 63, 9, COL.paper, (i, cx, cy, N) => { const r = hash(i) * .12 + .08; if (t < r) return null; return { s: 1 + .8 * Math.exp(-(t - r) * 25), color: i === N - 1 ? COL.green : COL.paper }; });
}

// ================= S3b: share =================
const SH = { x: 1100, y: 540, r: 330 }, INIT = ['L', 'M', 'A', 'J', 'S', 'K'];
const shDone = k => .62 + k * .16;
for (let k = 0; k < 6; k++) CUES.share.push(T.s3b + shDone(k));
function S3b(c, t) {
  HUD = COL.ink;
  c.fillStyle = COL.paper; c.fillRect(0, 0, W, H);
  c.fillStyle = COL.ink; c.globalAlpha = .1;
  for (let gx = 0; gx <= 48; gx++) for (let gy = 0; gy <= 27; gy++) fr(c, gx * 40 - 1.5, gy * 40 - 1.5, 3, 3);
  c.globalAlpha = 1;
  const done = INIT.filter((_, k) => t >= shDone(k)).length;
  const cp = E.outBack(prog(t, 0, .3));
  INIT.forEach((_, k) => {
    const a = -Math.PI / 2 + k * Math.PI / 3, ax = SH.x + Math.cos(a) * SH.r, ay = SH.y + Math.sin(a) * SH.r;
    const lp = E.outCubic(prog(t, .1 + .07 * k, .1 + .07 * k + .25));
    c.strokeStyle = COL.ink; c.lineWidth = 4; c.globalAlpha = .85;
    c.beginPath(); c.moveTo(SH.x, SH.y); c.lineTo(lerp(SH.x, ax, lp), lerp(SH.y, ay, lp)); c.stroke(); c.globalAlpha = 1;
    if (lp >= 1) {
      const u = (t * 1.6 + k * .17) % 1; c.fillStyle = COL.ink;
      fr(c, lerp(SH.x, ax, u) - 9, lerp(SH.y, ay, u) - 9, 18, 18);
    }
  });
  INIT.forEach((ch, k) => {
    const a = -Math.PI / 2 + k * Math.PI / 3, ax = SH.x + Math.cos(a) * SH.r, ay = SH.y + Math.sin(a) * SH.r;
    const s = E.outBack(prog(t, .1 + .07 * k + .2, .1 + .07 * k + .45)); if (s <= 0) return;
    const d = t >= shDone(k), tc = t - shDone(k);
    c.save(); c.translate(ax, ay); c.scale(s, s);
    c.fillStyle = COL.ink; c.beginPath(); c.arc(0, 0, 62, 0, 7); c.fill();
    c.fillStyle = COL.paper; c.font = `700 54px ${MONO}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(ch, 0, 4);
    if (d) {
      c.strokeStyle = COL.greenD; c.lineWidth = 9; c.beginPath(); c.arc(0, 0, 70, 0, 7); c.stroke();
      const bs = E.outBack(prog(tc, 0, .2)); c.fillStyle = COL.green; c.beginPath(); c.arc(46 * 1, -46, 22 * bs, 0, 7); c.fill();
      c.strokeStyle = COL.ink; c.lineWidth = 5; c.lineCap = 'round'; c.lineJoin = 'round';
      if (bs > .6) poly(c, [[36, -45], [44, -37], [57, -54]], prog(tc, .05, .22));
    }
    c.restore();
    if (d && tc < .5) { c.globalAlpha = (1 - tc / .5) * .8; c.strokeStyle = COL.greenD; c.lineWidth = 4; c.beginPath(); c.arc(ax, ay, 62 + E.outCubic(tc / .5) * 90, 0, 7); c.stroke(); c.globalAlpha = 1; }
  });
  const allDone = done === 6, fl = allDone ? Math.exp(-(t - shDone(5)) * 5) : 0;
  c.save(); c.translate(SH.x, SH.y); c.scale(cp * (1 + .08 * fl), cp * (1 + .08 * fl));
  c.fillStyle = allDone ? mix(COL.ink, COL.greenD, Math.min(1, .35 + fl)) : COL.ink; rr(c, -85, -85, 170, 170, 26); c.fill();
  c.fillStyle = COL.paper; layout('R').cells.forEach(([cx, cy]) => fr(c, -35 + cx * 14, -49 + cy * 14, 14, 14));
  const part = done < 6 ? prog(t, shDone(done) - .12, shDone(done)) : 0, arc = (done + part) / 6;
  c.strokeStyle = '#d4d4d4'; c.lineWidth = 10; c.beginPath(); c.arc(0, 0, 120, 0, 7); c.stroke();
  c.strokeStyle = COL.greenD; c.beginPath(); c.arc(0, 0, 120, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * arc); c.stroke();
  c.restore();
  c.font = `700 36px ${MONO}`; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.fillStyle = COL.paper; rr(c, SH.x - 110, SH.y + 142, 220, 52, 10); c.fill();
  c.fillStyle = COL.ink; c.fillText(`${done}/6 done`, SH.x, SH.y + 180);
  const cap = 'SHARE IT.';
  pText(c, cap, 100, H - 90 - 63, 9, COL.ink, (i, cx, cy, N) => { const r = hash(i + 2) * .12 + .08; if (t < r) return null; return { s: 1 + .8 * Math.exp(-(t - r) * 25), color: i === N - 1 ? COL.greenD : COL.ink }; });
}

// ================= S4: heatmap -> logo =================
const CAL = { c0: 21, r0: 11, cols: 7, rows: 5 }, R3 = { x0: 16, y0: 3 };
const LVC = ['#1c1c1c', '#14532d', '#15803d', '#22c55e', '#4ade80'];
const inCal = (gx, gy) => gx >= CAL.c0 && gx < CAL.c0 + CAL.cols && gy >= CAL.r0 && gy < CAL.r0 + CAL.rows;
const isR = (gx, gy) => { const lx = Math.floor((gx - R3.x0) / 3), ly = Math.floor((gy - R3.y0) / 3); return lx >= 0 && lx < 5 && ly >= 0 && ly < 7 && G.R[ly][lx] === 'X'; };
const lvl = (gx, gy) => { const h = hash2(gx, gy); return inCal(gx, gy) ? 1 + Math.floor(h * 4) : h < .18 ? 0 : h < .42 ? 1 : h < .68 ? 2 : h < .88 ? 3 : 4; };
const calT = n => .1 + n * .024;
for (let n = 0; n < 35; n++) CUES.cal.push(T.s4 + calT(n));

function S4(c, t) {
  HUD = COL.paper;
  c.fillStyle = COL.bg; c.fillRect(0, 0, W, H);
  const zp = E.inOutCubic(prog(t, 1.0, 1.75)), p = lerp(110, 40, zp), camx = lerp(24.5, 23.5, zp), camy = 13.5, shift = lerp(370, 0, zp);
  const lit = Math.max(0, Math.min(35, Math.floor((t - .1) / .024) + 1));
  const rows = [];
  for (let gy = -1; gy <= 28; gy++) for (let gx = -2; gx <= 49; gx++) {
    const x = 960 + shift + (gx - camx) * p, y = 540 + (gy - camy) * p;
    if (x < -p || x > W || y < -p || y > H) continue;
    const cal = inCal(gx, gy), gap = p * .11;
    let a;
    if (cal) a = clamp((t - calT((gy - CAL.r0) * 7 + (gx - CAL.c0))) / .12);
    else { const dx = Math.max(CAL.c0 - gx, 0, gx - (CAL.c0 + CAL.cols - 1)), dy = Math.max(CAL.r0 - gy, 0, gy - (CAL.r0 + CAL.rows - 1)); a = clamp((zp - .1 - .012 * Math.max(dx, dy)) * 5); }
    if (a <= 0) continue;
    let level = lvl(gx, gy), col = LVC[level];
    const d = Math.hypot(gx - 23.5, gy - 13.5), wv = Math.exp(-Math.pow((d - (t - 1.7) * 40) / 2.2, 2)) * (t > 1.7 ? 1 : 0);
    if (wv > .02) col = mix(col, '#d9ffe6', .65 * wv);
    let size = p - gap, rad = p * .14, s = a;
    const rc = isR(gx, gy);
    if (t > 1.8) {
      if (!rc) { const td = 1.8 + hash2(gx, gy + 7) * .3 + d * .002; s *= 1 - E.inCubic(prog(t, td, td + .28)); }
      else {
        const tw = 1.95 + hash2(gx + 3, gy) * .2; col = mix(col, COL.paper, E.outCubic(prog(t, tw, tw + .3)));
        const f = E.outCubic(prog(t, 2.45, 2.8125)); size = lerp(size, p, f); rad = lerp(rad, 0, f);
      }
    }
    if (s <= .01) continue;
    c.fillStyle = col;
    const sz = size * Math.min(1, s) * (cal && a < 1 ? E.outBack(a) : 1);
    if (rad < .5) fr(c, x + (p - sz) / 2, y + (p - sz) / 2, sz, sz); else { rr(c, x + (p - sz) / 2, y + (p - sz) / 2, sz, sz, rad); c.fill(); }
  }
  const ha = 1 - prog(zp, 0, .35);
  if (ha > 0) {
    c.globalAlpha = ha; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.fillStyle = COL.grey; c.font = `400 34px ${MONO}`; c.fillText('STREAK', 110, 300);
    c.fillStyle = COL.paper; c.font = `700 300px ${MONO}`; c.fillText(String(lit), 100, 560);
    c.fillStyle = COL.green; c.font = `700 52px ${MONO}`; c.fillText('DAYS IN A ROW', 110, 640);
    c.fillStyle = COL.grey; c.font = `400 22px ${MONO}`; c.textAlign = 'center';
    'MTWTFSS'.split('').forEach((d, i) => c.fillText(d, 960 + 370 + (CAL.c0 + i + .5 - 24.5) * 110, 540 + (CAL.r0 - 13.5) * 110 - 24));
    c.globalAlpha = 1;
  }
}

// ================= S5: lockup =================
const WORD = layout('RECUR'), WC = 48, WOX = 960 - WORD.w * WC / 2, WOY = 290;
const TAG = 'your habits, your way';
const TY0 = 1.0, TYS = .035;
for (let i = 0; i < TAG.length; i++) CUES.type.push(T.s5 + TY0 + i * TYS);
const restOrder = (() => { const idx = []; for (let i = 18; i < WORD.cells.length; i++) idx.push(i); idx.sort((a, b) => hash(a + 5) - hash(b + 5)); const r = {}; idx.forEach((v, k) => r[v] = k); return r; })();
for (let i = 18; i < WORD.cells.length; i++) CUES.letters.push(T.s5 + .45 + restOrder[i] * .01 + .35);
CUES.letters.sort((a, b) => a - b);

function S5(c, t) {
  HUD = COL.paper;
  c.fillStyle = COL.bg; c.fillRect(0, 0, W, H);
  c.save();
  const k = 1 + .015 * pulse(Math.max(0, t), 8); c.translate(960, 540); c.scale(k, k); c.translate(-960, -540);
  const mp = E.inOutQuart(prog(t, .3, .85));
  const cell = lerp(120, WC, mp), ox = lerp(660, WOX, mp), oy = lerp(120, WOY, mp);
  const die = i => 1 - E.inCubic(prog(t, 2.3 + hash(i + 40) * .28, 2.3 + hash(i + 40) * .28 + .22));
  c.fillStyle = COL.paper;
  WORD.cells.forEach(([cx, cy], i) => {
    const x = ox + cx * cell, y = oy + cy * cell;
    if (i < 18) { const s = die(i); if (s > .01) fr(c, x + cell * (1 - s) / 2, y + cell * (1 - s) / 2, cell * s, cell * s); return; }
    const tx = WOX + cx * WC, ty = WOY + cy * WC, land = .45 + restOrder[i] * .01 + .35, p = prog(t, land - .35, land);
    if (p <= 0) return;
    const ax = hash(i + 3) < .5, dir = hash(i + 9) < .5 ? -1 : 1, dist = 1200 + hash(i) * 400;
    const e = E.outExpo(p), px = lerp(tx + (ax ? dir * dist : 0), tx, e), py = lerp(ty + (ax ? 0 : dir * dist), ty, e);
    if (p < 1) for (let q = 4; q >= 1; q--) { const e2 = E.outExpo(prog(t - q * .014, land - .35, land)); c.globalAlpha = .4 * (1 - q / 5); fr(c, lerp(tx + (ax ? dir * dist : 0), tx, e2), lerp(ty + (ax ? 0 : dir * dist), ty, e2), WC, WC); }
    c.globalAlpha = 1; const s = die(i) * (t > land ? 1 + .1 * Math.exp(-(t - land) * 20) : 1);
    if (s > .01) fr(c, px + WC * (1 - s) / 2, py + WC * (1 - s) / 2, WC * s, WC * s);
  });
  c.restore();
  if (t < .7) for (let q = 0; q < 3; q++) {
    const tq = t - q * .09; if (tq <= 0) continue; const h = 420 + tq * 1700;
    c.globalAlpha = Math.exp(-tq * 4) * .7; c.strokeStyle = COL.paper; c.lineWidth = 3; c.strokeRect(960 - h * .72, 540 - h, h * 1.44, h * 2);
  }
  c.globalAlpha = 1;
  const n = Math.floor(clamp((t - TY0) / TYS, 0, TAG.length)), fadeA = 1 - prog(t, 2.3, 2.65);
  if (n > 0 && fadeA > 0) {
    c.globalAlpha = fadeA; c.font = `400 58px ${MONO}`; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.letterSpacing = '2px';
    const fw = c.measureText(TAG).width, sx = 960 - fw / 2; c.fillStyle = COL.paper; c.fillText(TAG.slice(0, n), sx, 700);
    const cw = c.measureText(TAG.slice(0, n)).width;
    if (n < TAG.length || Math.floor(t * 4) % 2 === 0) { c.fillStyle = COL.green; fr(c, sx + cw + 6, 655, 26, 56); }
    const ca = prog(t, 1.7, 1.9) * fadeA; c.globalAlpha = ca * .7; c.font = `400 26px ${MONO}`; c.letterSpacing = '8px'; c.fillStyle = COL.grey; c.textAlign = 'center';
    c.fillText('DAILY   WEEKLY   MONTHLY   YEARLY   ONCE', 960 + 4, 800);
    c.letterSpacing = '0px'; c.globalAlpha = 1;
  }
  c.letterSpacing = '0px';
}

// ================= compositor =================
const SC = [
  { a: T.s1, b: T.s2, f: S1 }, { a: T.s2, b: T.s3a, f: S2 }, { a: T.s3a, b: T.s3b, f: S3a },
  { a: T.s3b, b: T.s4, f: S3b }, { a: T.s4, b: T.s5, f: S4 }, { a: T.s5, b: DUR, f: S5 },
];
// the S3a->S3b hop is a hard cut in the story, S3b gets its own wipe
const TR = [
  { at: T.s2, kind: 'radial', i: 0 }, { at: T.s3a, kind: 'diag', i: 1 }, { at: T.s3b, kind: 'rand', i: 2 }, { at: T.s4, kind: 'rows', i: 3 },
];
const WIN0 = .12, WIN1 = .2;
// S3a is index 2, but the first scene array above has S3a at 2 and S3b at 3: transitions index scene i -> i+1
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mk = () => { const x = document.createElement('canvas'); x.width = W; x.height = H; return x; };
const bufA = mk(), bufB = mk(), ca = bufA.getContext('2d'), cb = bufB.getContext('2d');
const order = (kind, x, y, gx, gy) => {
  if (kind === 'radial') return Math.hypot(x - 960, y - 540) / 1100;
  if (kind === 'diag') return (x + y) / (W + H);
  if (kind === 'rows') return y / H;
  return hash2(gx, gy);
};
function drawScene(c, t) {
  let idx = 0; for (let i = 0; i < SC.length; i++) if (t >= SC[i].a) idx = i;
  c.save(); SC[idx].f(c, t - SC[idx].a); c.restore(); return idx;
}
function render(t) {
  t = clamp(t, 0, DUR - 1e-6);
  const tr = TR.find(r => t >= r.at - WIN0 && t < r.at + WIN1);
  if (!tr) { drawScene(ctx, t); }
  else {
    const A = SC[tr.i], B = SC[tr.i + 1];
    ca.save(); A.f(ca, t - A.a); ca.restore(); const hudA = HUD;
    cb.save(); B.f(cb, Math.max(0, t - B.a)); cb.restore(); const hudB = HUD;
    const p = (t - (tr.at - WIN0)) / (WIN0 + WIN1);
    ctx.drawImage(bufA, 0, 0);
    for (let gy = 0; gy < 27; gy++) for (let gx = 0; gx < 48; gx++) {
      const x = gx * 40, y = gy * 40, thr = .72 * order(tr.kind, x + 20, y + 20, gx, gy) + .28 * hash2(gx + 9, gy + 4);
      if (p > thr) ctx.drawImage(bufB, x, y, 40, 40, x, y, 40, 40);
    }
    HUD = p > .5 ? hudB : hudA;
  }
  // timecode HUD (hidden in the typography scene)
  if (HUD) { ctx.save(); ctx.globalAlpha = .55; ctx.fillStyle = HUD; ctx.font = `400 22px ${MONO}`; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic'; ctx.letterSpacing = '2px';
  ctx.fillText(`${t.toFixed(2).padStart(5, '0')} / ${DUR.toFixed(2)}`, W - 60, H - 52); ctx.restore(); }
}
window.render = render; window.CUES = CUES; window.DUR = DUR; window.FPS = FPS;

// ---------- preview mode ----------
const q = new URLSearchParams(location.search);
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.transform = `scale(${s})`; cv.style.left = (innerWidth - W * s) / 2 + 'px'; cv.style.top = (innerHeight - H * s) / 2 + 'px'; }
window.ready = document.fonts.load('700 20px "Geist Mono"').then(() => document.fonts.load('400 20px "Geist Mono"')).then(() => {
  if (q.has('render')) return;
  fit(); addEventListener('resize', fit);
  if (q.has('t')) { render(parseFloat(q.get('t'))); return; }
  let t0 = performance.now(), paused = false, held = 0;
  addEventListener('keydown', e => { if (e.code === 'Space') { paused = !paused; if (!paused) t0 = performance.now() - held * 1000; } });
  (function loop(now) { if (!paused) { held = ((now - t0) / 1000) % DUR; render(held); } requestAnimationFrame(loop); })(performance.now());
});
})();
</script>
