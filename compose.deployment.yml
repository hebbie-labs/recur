services:
  frontend-dev:
    image: ghcr.io/hebbie-labs/recur-frontend:dev
    container_name: recur-frontend-dev
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_URL=http://backend-dev:8080
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    depends_on:
      - backend-dev

  backend-dev:
    image: ghcr.io/hebbie-labs/recur-backend:dev
    container_name: recur-backend-dev
    restart: unless-stopped
    environment:
      - DB_URL=jdbc:postgresql://db-dev:5432/recur
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - FRONTEND_URL=https://dev.recur.dpdns.org
      - CORS_ALLOWED_ORIGIN=https://dev.recur.dpdns.org
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - MAIL_FROM=noreply@recur.dpdns.org
    expose:
      - "8080"
    depends_on:
      - db-dev

  db-dev:
    image: ghcr.io/hebbie-labs/recur-db:dev
    container_name: recur-db-dev
    restart: unless-stopped
    environment:
      - POSTGRES_DB=recur
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - recur-db-dev-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5480:5432"

  frontend-www:
    image: ghcr.io/hebbie-labs/recur-frontend:coming-soon
    container_name: recur-frontend-www
    restart: unless-stopped
    environment:
      - COMING_SOON_MODE=true
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"

networks:
  default:
    name: recur_default

volumes:
  recur-db-dev-data:
