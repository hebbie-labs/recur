spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/recur}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=data
server.port=8080
server.forward-headers-strategy=framework

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

app.oauth2.redirect-path=/oauth/success

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:noreply@recur.app}
app.mail.verification-expiry-hours=${MAIL_VERIFICATION_EXPIRY_HOURS:24}
app.mail.resend-cooldown-seconds=${MAIL_RESEND_COOLDOWN_SECONDS:60}

app.frontend.url=${FRONTEND_URL:http://localhost:3000}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}