plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ch.noseryoung'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

configurations {
	all {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'

	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// dotenv (.env Datei automatisch einlesen)
	developmentOnly 'me.paulschwarz:springboot4-dotenv:5.1.0'

	// Log4j2
	implementation 'org.springframework.boot:spring-boot-starter-log4j2'
	
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	// Web Push (VAPID) für Push-Benachrichtigungen (#102). bcprov ist in
	// web-push's POM als optional deklariert, Gradle zieht es daher nicht
	// automatisch mit - explizit in derselben Version wie dort referenziert.
	implementation 'nl.martijndwars:web-push:5.1.2'
	implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
	// web-push's PushService#send() returns org.apache.http.HttpResponse, but
	// httpclient is only declared "runtime" scope in its POM - needed here too
	// since our code reads the response status to prune expired subscriptions.
	implementation 'org.apache.httpcomponents:httpclient:4.5.13'
	// Same story as httpclient above: PushService#send() throws
	// org.jose4j.lang.JoseException, which is also only "runtime" scoped
	// in web-push's POM.
	implementation 'org.bitbucket.b_c:jose4j:0.7.9'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}