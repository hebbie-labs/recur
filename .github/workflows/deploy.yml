name: build-and-deploy
on:
  push:
    branches: [dev]
    tags: ["v*", "coming-soon-*"]
  workflow_dispatch: {}

# GITHUB_TOKEN needs explicit packages:write, or GHCR push fails on repos
# where default token permissions are read-only.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set tag
        id: tag
        run: |
          # deploy-prod/deploy-dev always pull a fixed tag (":latest"/":dev")
          # from compose.deployment.yml, so every build also pushes that moving tag
          # alongside the immutable one (the git tag for prod releases).
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "moving_tag=latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/coming-soon-* ]]; then
            echo "env=coming-soon" >> $GITHUB_OUTPUT
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "moving_tag=coming-soon" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "tag=dev" >> $GITHUB_OUTPUT
            echo "moving_tag=dev" >> $GITHUB_OUTPUT
          fi

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/hebbie-labs/recur-backend:${{ steps.tag.outputs.tag }}
            ghcr.io/hebbie-labs/recur-backend:${{ steps.tag.outputs.moving_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/hebbie-labs/recur-frontend:${{ steps.tag.outputs.tag }}
            ghcr.io/hebbie-labs/recur-frontend:${{ steps.tag.outputs.moving_tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - uses: docker/build-push-action@v6
        with:
          context: ./database
          push: true
          tags: |
            ghcr.io/hebbie-labs/recur-db:${{ steps.tag.outputs.tag }}
            ghcr.io/hebbie-labs/recur-db:${{ steps.tag.outputs.moving_tag }}
          cache-from: type=gha,scope=database
          cache-to: type=gha,mode=max,scope=database

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: [self-hosted]
    concurrency: deploy-dev
    steps:
      # Own docker config per job: the shared runner's ~/.docker must stay
      # untouched, login-action's post-step `docker logout` would wipe the
      # ghcr.io login other repos on this runner rely on.
      - run: echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"
      # GHCR packages are private by default - the build job's login only
      # covers its own (github-hosted) docker daemon, so this runner needs
      # its own login before it can pull.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # compose.deployment.yml lives in this repo but the deploy jobs only
      # pull images - this syncs the file itself. Untracked files that are
      # byte-identical to the incoming version are removed first so a stale
      # local copy doesn't block the pull; real differences still abort it.
      - run: |
          cd /srv/recur
          git fetch origin dev
          for f in $(git ls-tree -r --name-only origin/dev); do
            if [ -f "$f" ] && ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              cmp -s "$f" <(git show origin/dev:"$f") && rm "$f"
            fi
          done
          git pull
      - run: docker compose -f /srv/recur/compose.deployment.yml pull frontend-dev backend-dev db-dev
      # external network shared with cloudflared, see compose.deployment.yml
      - run: docker network inspect tunnel >/dev/null 2>&1 || docker network create tunnel
      - run: docker compose -f /srv/recur/compose.deployment.yml up -d frontend-dev backend-dev db-dev

  deploy-prod:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted]
    concurrency: deploy-prod
    environment: production # requires manual approval, see below
    steps:
      # Own docker config per job: the shared runner's ~/.docker must stay
      # untouched, login-action's post-step `docker logout` would wipe the
      # ghcr.io login other repos on this runner rely on.
      - run: echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          cd /srv/recur
          git fetch origin dev
          for f in $(git ls-tree -r --name-only origin/dev); do
            if [ -f "$f" ] && ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              cmp -s "$f" <(git show origin/dev:"$f") && rm "$f"
            fi
          done
          git pull
      - run: docker compose -f /srv/recur/compose.deployment.yml pull frontend-prod backend-prod db-prod
      # external network shared with cloudflared, see compose.deployment.yml
      - run: docker network inspect tunnel >/dev/null 2>&1 || docker network create tunnel
      - run: docker compose -f /srv/recur/compose.deployment.yml up -d frontend-prod backend-prod db-prod

  deploy-www:
    needs: build
    if: startsWith(github.ref, 'refs/tags/coming-soon-')
    runs-on: [self-hosted]
    concurrency: deploy-www
    steps:
      # Own docker config per job: the shared runner's ~/.docker must stay
      # untouched, login-action's post-step `docker logout` would wipe the
      # ghcr.io login other repos on this runner rely on.
      - run: echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # frontend-www is COMING_SOON_MODE-gated (no real user data behind it),
      # so unlike deploy-prod this doesn't need manual approval - and it
      # needs no backend/db, see compose.deployment.yml.
      - run: |
          cd /srv/recur
          git fetch origin dev
          for f in $(git ls-tree -r --name-only origin/dev); do
            if [ -f "$f" ] && ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              cmp -s "$f" <(git show origin/dev:"$f") && rm "$f"
            fi
          done
          git pull
      - run: docker compose -f /srv/recur/compose.deployment.yml pull frontend-www
      # external network shared with cloudflared, see compose.deployment.yml
      - run: docker network inspect tunnel >/dev/null 2>&1 || docker network create tunnel
      - run: docker compose -f /srv/recur/compose.deployment.yml up -d frontend-www
